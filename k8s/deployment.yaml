apiVersion: apps/v1
kind: Deployment
metadata:
  name: logwise
  labels:
    app: logwise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logwise
  template:
    metadata:
      labels:
        app: logwise
    spec:
      containers:
        - name: logwise
          image: logwise-logwise:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          # Key 通过 Secret 注入环境变量，不进镜像
          envFrom:
            - secretRef:
                name: logwise-secret
          # 资源配额：调度依据 + 限额
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # 就绪探针：服务就绪才接流量
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          # 存活探针：不健康自动重启容器
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
